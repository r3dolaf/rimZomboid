<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- M3: la página llega a los bordes (el notch lo aparta el CSS) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Villamuerta</title>
    <!-- M3: instalable, a pantalla completa y con su icono -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Villamuerta" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        /* M1 y M3: sin el zoom de la página (dos toques o dos dedos fuera del mapa, que lo
           descolocaba todo), pero los paneles se siguen desplazando. */
        touch-action: pan-x pan-y;
        /* M3: sin «tirar para recargar» en Android ni el destello gris al tocar un botón. */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        /* M1: sobre el mapa, los gestos son del juego, no del navegador. */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
